# hyprprofile picker - fuzzel
#
# Translucent panel with a rounded, accent-coloured border. The border colour is
# passed on the command line from the wallpaper currently in use, so it tracks
# the palette. Blur comes from Hyprland's layer rule on the "launcher"
# namespace, which end-4's rice already sets and snippets/keybind.lua adds for
# the other one.

[main]
font=Rubik:size=12
prompt=
icon-theme=Papirus-Dark
icons-enabled=yes
image-size-ratio=1.0
lines=9
width=34
horizontal-pad=18
vertical-pad=16
inner-pad=12
line-height=34
letter-spacing=0
tabs=4
layer=overlay

[border]
width=2
radius=24

[colors]
background=1010169e
text=e8e8f0ff
match=8ab4f8ff
selection=ffffff1a
selection-text=ffffffff
selection-match=8ab4f8ff
border=8ab4f8ff
placeholder=e8e8f099
