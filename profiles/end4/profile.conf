# end-4/dots-hyprland (illogical-impulse) - the Material 3 rice from the video.
# Quickshell shell, matugen wallpaper-derived colours, fuzzel launcher.
#
# The paths below are exactly what end-4's installer writes into, plus the
# matugen output targets (gtk-3.0/gtk.css, gtk-4.0/gtk.css, fuzzel/, hypr/)
# and the quickshell state dir that holds the generated palette and venv.

DISPLAY_NAME="Material 3"
DESCRIPTION="end-4 illogical-impulse - Quickshell bar, Material You colours"
ICON=""
ACCENT="#a3c9ff"      # colour of this style's dot in the picker
PICKER="fuzzel"        # launcher the picker should use while this rice is up

CONFIG_PATHS=(
  hypr
  quickshell
  fuzzel
  matugen
  kitty
  foot
  mpv
  wlogout
  Kvantum
  kde-material-you-colors
  fontconfig
  zshrc.d
  xdg-desktop-portal
  gtk-3.0
  gtk-4.0
  chrome-flags.conf
  code-flags.conf
  darklyrc
  dolphinrc
  kdeglobals
  konsolerc
  starship.toml
)

DATA_PATHS=(
  konsole
  kxmlgui5
)

# ~/.local/state/quickshell (venv + matugen's generated palette) is left
# unmanaged on purpose: no other profile reads it, so there is nothing to
# isolate, and profiling it would mean the venv build had to happen while
# end4 was already the active profile.
STATE_PATHS=()

REQUIRES=(hyprctl qs matugen fuzzel hypridle cliphist wl-paste)
